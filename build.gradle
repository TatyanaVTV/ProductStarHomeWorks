plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'org.jetbrains:annotations:24.0.1'

    // Lombok
    implementation 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // SLF4J + Logback
    implementation 'ch.qos.logback:logback-classic:1.4.11'
    implementation 'org.slf4j:slf4j-api:2.0.13'

    // Mockito
    testImplementation 'org.mockito:mockito-core:5.1.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.1.1'
//    // PowerMock для работы со статическими полями и методами
//    testImplementation 'org.powermock:powermock-api-mockito2:2.0.9'
//    testImplementation 'org.powermock:powermock-module-junit4:2.0.9'
//    testImplementation 'org.mockito:mockito-inline:5.1.1'
//    testImplementation 'org.mockito:mockito-junit-jupiter:5.1.1'

    testImplementation 'org.jacoco:org.jacoco.agent:0.8.11'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.24.2'

    testImplementation 'com.github.stefanbirkner:system-lambda:1.2.0'
}

test {
    useJUnitPlatform()

    // Включение параллельного выполнения
    maxParallelForks = Runtime.runtime.availableProcessors()

    // Изоляция тестов — каждый тест в отдельном процессе
    forkEvery = 1
    forkDelay = 1000

    // Настройки JVM для тестов
    jvmArgs = ['-Xmx1024m', '-XX:+UseG1GC']

    // Опции JUnit Platform
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'fixed'
    systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism', '4'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
}